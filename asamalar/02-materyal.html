<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Uzay Ada — Whitebox 01</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  #scene { display: block; width: 100vw; height: 100vh; cursor: crosshair; }

  #stats {
    position: fixed; top: 10px; left: 10px; z-index: 10;
    padding: 8px 10px 9px;
    background: rgba(10, 11, 13, 0.42);
    border: 1px solid rgba(255, 255, 255, 0.10);
    border-radius: 4px;
    color: #d8dade;
    font-size: 11px; line-height: 1.55;
    letter-spacing: 0.02em;
    user-select: none; pointer-events: none;
    backdrop-filter: blur(2px);
  }
  #stats .title { color: #8b9096; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; }
  #stats .row { display: flex; justify-content: space-between; gap: 14px; min-width: 148px; }
  #stats .k { color: #8b9096; }
  #stats .v { color: #f2f4f6; font-variant-numeric: tabular-nums; }

  #hint {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    z-index: 10; padding: 7px 14px;
    background: rgba(10, 11, 13, 0.42);
    border: 1px solid rgba(255, 255, 255, 0.10);
    border-radius: 999px;
    color: #c9ccd1; font-size: 11px; letter-spacing: 0.03em;
    user-select: none; pointer-events: none;
    transition: opacity 0.5s ease;
  }
  #hint.gone { opacity: 0; }

  #fatal {
    position: fixed; inset: 0; z-index: 20; display: none;
    place-items: center; padding: 32px; background: #0a0b0d; color: #e8eaec;
    font-size: 13px; line-height: 1.7; text-align: center; white-space: pre-wrap;
  }
</style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="stats">
    <div class="title">Whitebox 01</div>
    <div class="row"><span class="k">fps</span><span class="v" id="s-fps">-</span></div>
    <div class="row"><span class="k">frame</span><span class="v" id="s-ms">-</span></div>
    <div class="row"><span class="k">draw calls</span><span class="v" id="s-calls">-</span></div>
    <div class="row"><span class="k">triangles</span><span class="v" id="s-tris">-</span></div>
  </div>

  <div id="hint">Tıkla &amp; fare hareketini kilitle &nbsp;·&nbsp; yaw ±80° &nbsp;·&nbsp; R: başını sıfırla &nbsp;·&nbsp; ESC: kilidi bırak</div>
  <div id="fatal"></div>

  <script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
  <script>
  (function () {
    'use strict';

    var fatal = document.getElementById('fatal');
    function die(msg) {
      fatal.style.display = 'grid';
      fatal.textContent = msg;
      throw new Error(msg);
    }
    if (!window.THREE) {
      die('three.js yüklenemedi.\n\nBu dosya CDN bağlantısına ihtiyaç duyar (file:// üzerinden çalışır).\nİnternet bağlantını kontrol et ve sayfayı yenile.');
    }

    var CFG = {
      renderer: {
        fov: 100, near: 0.08, far: 40000,
        pixelRatio: 1.25, exposure: 0.72, useLegacyLights: true, shadows: true
      },
      lens: {
        distortion: 0.07, vignette: 0.4, vignetteStart: 0.42, vignetteEnd: 1.05,
        bloom: 0.55, bloomThreshold: 0.85, bloomKnee: 0.3, dither: 0.004
      },
      head: {
        baseYaw: 180, yaw: 80, pitchMin: -58, pitchMax: 72,
        sensitivity: 0.0021, height: 1.12, forward: 0.12,
        startPitch: -9
      },
      sun: { azimuth: 118, elevation: 24, intensity: 1.7, color: 0xfff1de, distance: 1000 },
      fill: { intensity: 1.25, color: 0x74aede, distance: 1000 },
      rim: { intensity: 0.34, color: 0xd8c39c, distance: 1000 },
      ambient: { sky: 0x24313f, ground: 0x0d1014, intensity: 0.55 },
      led: { color: 0x86e9ff, intensity: 1.15, distance: 5.0, underTable: 0.8, deck: 1.1 },
      env: { planetGain: 2.6, starGain: 9, galaxyGain: 0.08, size: 256 },
      shadow: { size: 2048, extent: 9, near: 820, far: 1220, bias: -0.0009, normalBias: 0.035 },
      tex: { wood: 512, metal: 256, panel: 256, ground: 512, cloud: 512, band: 512, galaxy: 1024, nebula: 256, flare: 128 },
      deck: { radius: 2.05, thickness: 0.07, postCount: 4, postHeight: 0.34 },
      moon: { radius: 30, plateau: 8.5, relief: 0.05, detail: 0.016, lip: 0.9, rimWobble: 0.085, micro: 0.06, microStart: 2.6, microEnd: 4.2, uvScale: 5.5 },
      props: {
        table: { radius: 0.72, topY: 0.74, thickness: 0.055 },
        chair: { radius: 1.1, seatY: 0.45, backTop: 0.98, count: 4, seatIndex: 2 }
      },
      planets: {
        home:    { azimuth: -28, elevation: 16, distance: 3000, radius: 1300, seed: 1201, wobble: 0.011, atmo: 1.035, atmoColor: 0x6fb6ff, atmoPower: 2.6, cloudSpin: 0.0016 },
        arid:    { azimuth: 36,  elevation: -1,  distance: 5000, radius: 900,  seed: 2202, wobble: 0.02, atmo: 1.02, atmoColor: 0xd8a878, atmoPower: 3.6 },
        giant:   { azimuth: 10,  elevation: 19,  distance: 6000, radius: 1300, seed: 3203, wobble: 0.005 },
        moonlet: { azimuth: -42, elevation: 2,   distance: 1200, radius: 84,   seed: 4204, wobble: 0.05 },
        speck:   { azimuth: -14, elevation: 33,  distance: 2400, radius: 50,   seed: 5205, wobble: 0.07 }
      },
      scatter: {
        seed: 20260926,
        belt: { count: 160, inner: 1800, outer: 3600, bandHeight: 210, minSize: 6, maxSize: 34, spin: 0.0016 }
      },
      sky: {
        starCount: 13000, starRadius: 90000,
        bandCount: 24000, bandClumps: 3400, bandRadius: 100000, bandSpread: 0.055,
        galaxy: { azimuth: 58, elevation: 26, distance: 120000, radius: 48000, tilt: 0.68, roll: 0.3, spin: 0.35 },
        nebula: [
          { azimuth: -52, elevation: 30, distance: 78000, size: 46000, color: 0x2a4d8c, opacity: 0.5, seed: 811 },
          { azimuth: 22, elevation: 46, distance: 92000, size: 52000, color: 0x53307a, opacity: 0.38, seed: 823 },
          { azimuth: 4, elevation: 8, distance: 68000, size: 30000, color: 0x1f5f6b, opacity: 0.3, seed: 829 }
        ],
        flares: 46,
        sunDistance: 150000, sunRadius: 2400, sunGlowRadius: 13000,
        pixelRatio: 1
      }
    };

    var SURF = {
      woodDark:  [0.128, 0.075, 0.045],
      woodLight: [0.335, 0.208, 0.118],
      metal:     [0.520, 0.545, 0.575],
      metalDark: [0.180, 0.198, 0.222],
      panel:     [0.118, 0.128, 0.142],
      panelLine: [0.215, 0.232, 0.252],
      groundLo:  [0.082, 0.082, 0.088],
      groundHi:  [0.235, 0.238, 0.240],
      groundWarm:[0.225, 0.205, 0.178],
      belt:      [0.185, 0.190, 0.198],
      land:      [0.108, 0.135, 0.098],
      landDry:   [0.180, 0.160, 0.118],
      sea:       [0.055, 0.085, 0.130],
      arid:      [0.185, 0.150, 0.120],
      giantA:    [0.230, 0.205, 0.175],
      giantB:    [0.320, 0.290, 0.250]
    };

    function mulberry32(a) {
      return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        var t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
    function smoothstep(a, b, x) { var t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
    function hash3(x, y, z, seed) {
      var h = Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(z, 1274126177) + Math.imul(seed, 982451653);
      h = (h ^ (h >>> 13)) | 0;
      h = Math.imul(h, 1274126177);
      h = (h ^ (h >>> 16)) >>> 0;
      return h / 4294967296;
    }
    function vnoise3(x, y, z, seed) {
      var xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
      var xf = x - xi, yf = y - yi, zf = z - zi;
      var u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
      var c000 = hash3(xi, yi, zi, seed),         c100 = hash3(xi + 1, yi, zi, seed);
      var c010 = hash3(xi, yi + 1, zi, seed),     c110 = hash3(xi + 1, yi + 1, zi, seed);
      var c001 = hash3(xi, yi, zi + 1, seed),     c101 = hash3(xi + 1, yi, zi + 1, seed);
      var c011 = hash3(xi, yi + 1, zi + 1, seed), c111 = hash3(xi + 1, yi + 1, zi + 1, seed);
      var x00 = c000 + (c100 - c000) * u, x10 = c010 + (c110 - c010) * u;
      var x01 = c001 + (c101 - c001) * u, x11 = c011 + (c111 - c011) * u;
      var y0 = x00 + (x10 - x00) * v, y1 = x01 + (x11 - x01) * v;
      return y0 + (y1 - y0) * w;
    }
    function fbm3(x, y, z, seed, octaves) {
      var amp = 0.5, freq = 1, sum = 0, norm = 0;
      for (var i = 0; i < octaves; i++) {
        sum += amp * vnoise3(x * freq, y * freq, z * freq, seed + i * 131);
        norm += amp; amp *= 0.5; freq *= 2.03;
      }
      return sum / norm;
    }
    function dirFrom(azDeg, elDeg) {
      var az = azDeg * Math.PI / 180, el = elDeg * Math.PI / 180;
      return new THREE.Vector3(-Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az));
    }

    var maxAniso = 8;
    function dataTex(w, h, fill, opts) {
      opts = opts || {};
      var data = new Uint8Array(w * h * 4);
      fill(data, w, h);
      var t = new THREE.DataTexture(data, w, h, THREE.RGBAFormat);
      t.wrapS = opts.wrapS || THREE.RepeatWrapping;
      t.wrapT = opts.wrapT || THREE.RepeatWrapping;
      t.magFilter = opts.nearest ? THREE.NearestFilter : THREE.LinearFilter;
      t.minFilter = THREE.LinearMipmapLinearFilter;
      t.generateMipmaps = true;
      t.anisotropy = maxAniso;
      t.colorSpace = opts.srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
      if (opts.repeat) t.repeat.set(opts.repeat[0], opts.repeat[1]);
      t.needsUpdate = true;
      return t;
    }
    function normalTex(height, w, h, strength) {
      return dataTex(w, h, function (d) {
        for (var y = 0; y < h; y++) {
          var yp = ((y - 1 + h) % h) * w, yn = ((y + 1) % h) * w, yc = y * w;
          for (var x = 0; x < w; x++) {
            var xp = (x - 1 + w) % w, xn = (x + 1) % w;
            var nx = (height[yc + xp] - height[yc + xn]) * strength;
            var ny = (height[yp + x] - height[yn + x]) * strength;
            var inv = 1 / Math.sqrt(nx * nx + ny * ny + 1);
            var i = (yc + x) * 4;
            d[i] = (nx * inv * 0.5 + 0.5) * 255;
            d[i + 1] = (ny * inv * 0.5 + 0.5) * 255;
            d[i + 2] = (inv * 0.5 + 0.5) * 255;
            d[i + 3] = 255;
          }
        }
      });
    }
    function mixRGB(a, b, t, out) {
      out[0] = a[0] + (b[0] - a[0]) * t;
      out[1] = a[1] + (b[1] - a[1]) * t;
      out[2] = a[2] + (b[2] - a[2]) * t;
    }
    var tmpRGB = [0, 0, 0];

    function woodMaps() {
      var S = CFG.tex.wood;
      var height = new Float32Array(S * S);
      var i, x, y, u, v, warp, ring, fine, pore, k;
      for (y = 0; y < S; y++) {
        for (x = 0; x < S; x++) {
          u = x / S; v = y / S;
          warp = fbm3(u * 2.6, v * 1.1, 4.5, 411, 4) - 0.5;
          ring = Math.sin((v * 8 + warp * 3.4 + fbm3(u * 1.1, v * 0.5, 8.2, 77, 3) * 1.8) * Math.PI);
          fine = fbm3(u * 260, v * 34, 2.2, 913, 3) - 0.5;
          pore = Math.max(0, fbm3(u * 70, v * 420, 6.6, 517, 2) - 0.6) * 2.4;
          height[y * S + x] = ring * 0.3 + fine * 1.1 - pore;
        }
      }
      var map = dataTex(S, S, function (d) {
        for (y = 0; y < S; y++) {
          for (x = 0; x < S; x++) {
            k = y * S + x;
            u = x / S; v = y / S;
            var t = clamp(0.5 + height[k] * 0.62, 0, 1);
            t = Math.pow(t, 1.25);
            mixRGB(SURF.woodDark, SURF.woodLight, t, tmpRGB);
            var spec = 1 + (fbm3(u * 90, v * 12, 3.3, 131, 2) - 0.5) * 0.22;
            i = k * 4;
            d[i] = clamp(tmpRGB[0] * spec, 0, 1) * 255;
            d[i + 1] = clamp(tmpRGB[1] * spec, 0, 1) * 255;
            d[i + 2] = clamp(tmpRGB[2] * spec, 0, 1) * 255;
            d[i + 3] = 255;
          }
        }
      }, { srgb: true });
      var rough = dataTex(S, S, function (d) {
        for (var k2 = 0; k2 < S * S; k2++) {
          var r = clamp(0.62 - height[k2] * 0.16, 0.28, 0.85) * 255;
          d[k2 * 4] = r; d[k2 * 4 + 1] = r; d[k2 * 4 + 2] = r; d[k2 * 4 + 3] = 255;
        }
      });
      return { map: map, normalMap: normalTex(height, S, S, 2.2), roughnessMap: rough };
    }

    function metalMaps(seed, brushed, panelLines) {
      var S = CFG.tex.metal;
      var height = new Float32Array(S * S);
      var x, y, u, v, i, k;
      for (y = 0; y < S; y++) {
        for (x = 0; x < S; x++) {
          u = x / S; v = y / S;
          var streak = fbm3(u * (brushed ? 620 : 90), v * (brushed ? 5 : 90), 1.7, seed, 3) - 0.5;
          var grain = fbm3(u * 24, v * 24, 5.1, seed + 31, 3) - 0.5;
          height[y * S + x] = streak * 1.3 + grain * 0.4;
        }
      }
      if (panelLines) {
        for (y = 0; y < S; y++) {
          for (x = 0; x < S; x++) {
            var gx = Math.abs(((x / S) * 4 % 1) - 0.5), gy = Math.abs(((y / S) * 4 % 1) - 0.5);
            var line = Math.max(smoothstep(0.5, 0.47, gx), smoothstep(0.5, 0.47, gy));
            height[y * S + x] -= line * 1.6;
          }
        }
      }
      var map = dataTex(S, S, function (d) {
        for (k = 0; k < S * S; k++) {
          var t = clamp(0.5 + height[k] * 0.8, 0, 1);
          mixRGB(SURF.metalDark, SURF.metal, t, tmpRGB);
          i = k * 4;
          d[i] = tmpRGB[0] * 255; d[i + 1] = tmpRGB[1] * 255; d[i + 2] = tmpRGB[2] * 255; d[i + 3] = 255;
        }
      }, { srgb: true });
      var rough = dataTex(S, S, function (d) {
        for (k = 0; k < S * S; k++) {
          var r = clamp(0.34 + height[k] * 0.3, 0.12, 0.72) * 255;
          d[k * 4] = r; d[k * 4 + 1] = r; d[k * 4 + 2] = r; d[k * 4 + 3] = 255;
        }
      });
      var metal = dataTex(S, S, function (d) {
        for (k = 0; k < S * S; k++) {
          var m = clamp(0.86 + height[k] * 0.5, 0.4, 1) * 255;
          d[k * 4] = m; d[k * 4 + 1] = m; d[k * 4 + 2] = m; d[k * 4 + 3] = 255;
        }
      });
      return { map: map, normalMap: normalTex(height, S, S, brushed ? 1.5 : 2.6), roughnessMap: rough, metalnessMap: metal };
    }

    function compositeMaps() {
      var S = CFG.tex.panel;
      var height = new Float32Array(S * S);
      var x, y, k, i, u, v;
      for (y = 0; y < S; y++) {
        for (x = 0; x < S; x++) {
          u = x / S; v = y / S;
          var micro = fbm3(u * 150, v * 150, 2.2, 1201, 3) - 0.5;
          var weave = (Math.sin(u * Math.PI * 180) * Math.sin(v * Math.PI * 180)) * 0.25;
          var gx = Math.abs(((u * 3) % 1) - 0.5), gy = Math.abs(((v * 3) % 1) - 0.5);
          var seam = Math.max(smoothstep(0.5, 0.46, gx), smoothstep(0.5, 0.46, gy));
          height[y * S + x] = micro * 0.7 + weave - seam * 2.2;
        }
      }
      var map = dataTex(S, S, function (d) {
        for (k = 0; k < S * S; k++) {
          var t = clamp(0.5 + height[k] * 0.35, 0, 1);
          mixRGB(SURF.panel, SURF.panelLine, t, tmpRGB);
          i = k * 4;
          d[i] = tmpRGB[0] * 255; d[i + 1] = tmpRGB[1] * 255; d[i + 2] = tmpRGB[2] * 255; d[i + 3] = 255;
        }
      }, { srgb: true });
      var rough = dataTex(S, S, function (d) {
        for (k = 0; k < S * S; k++) {
          var r = clamp(0.46 - height[k] * 0.12, 0.22, 0.8) * 255;
          d[k * 4] = r; d[k * 4 + 1] = r; d[k * 4 + 2] = r; d[k * 4 + 3] = 255;
        }
      });
      return { map: map, normalMap: normalTex(height, S, S, 1.8), roughnessMap: rough };
    }

    function regolithMaps() {
      var S = CFG.tex.ground;
      var height = new Float32Array(S * S);
      var rnd = mulberry32(3301);
      var craters = [];
      for (var c = 0; c < 26; c++) {
        craters.push({ x: rnd(), y: rnd(), r: 0.02 + Math.pow(rnd(), 2.4) * 0.11, d: 0.35 + rnd() * 0.65 });
      }
      var x, y, k, i, u, v;
      for (y = 0; y < S; y++) {
        for (x = 0; x < S; x++) {
          u = x / S; v = y / S;
          var base = (fbm3(u * 7, v * 7, 3.3, 5501, 5) - 0.5) * 1.5
                   + (fbm3(u * 26, v * 26, 8.8, 5507, 4) - 0.5) * 0.6
                   + (fbm3(u * 120, v * 120, 1.4, 5513, 3) - 0.5) * 0.28;
          for (var ci = 0; ci < craters.length; ci++) {
            var cr = craters[ci];
            var dx = u - cr.x, dy = v - cr.y;
            var dist = Math.sqrt(dx * dx + dy * dy) / cr.r;
            if (dist < 1.6) {
              var bowl = -cr.d * (1 - smoothstep(0.55, 1.0, dist));
              var rim = cr.d * 0.55 * Math.exp(-Math.pow((dist - 1.0) * 4.5, 2));
              base += bowl + rim;
            }
          }
          height[y * S + x] = base;
        }
      }
      var map = dataTex(S, S, function (d) {
        for (y = 0; y < S; y++) {
          for (x = 0; x < S; x++) {
            k = y * S + x;
            u = x / S; v = y / S;
            var t = clamp(0.5 + height[k] * 0.55, 0, 1);
            var warm = fbm3(u * 3.1, v * 3.1, 9.9, 6607, 3);
            mixRGB(SURF.groundLo, warm > 0.55 ? SURF.groundWarm : SURF.groundHi, Math.pow(t, 1.1), tmpRGB);
            var speck = fbm3(u * 420, v * 420, 5.5, 6613, 2);
            var sp = 1 + (speck - 0.5) * 0.35;
            i = k * 4;
            d[i] = clamp(tmpRGB[0] * sp, 0, 1) * 255;
            d[i + 1] = clamp(tmpRGB[1] * sp, 0, 1) * 255;
            d[i + 2] = clamp(tmpRGB[2] * sp, 0, 1) * 255;
            d[i + 3] = 255;
          }
        }
      }, { srgb: true, repeat: [1, 1] });
      var rough = dataTex(S, S, function (d) {
        for (k = 0; k < S * S; k++) {
          var r = clamp(0.94 - height[k] * 0.1, 0.72, 1) * 255;
          d[k * 4] = r; d[k * 4 + 1] = r; d[k * 4 + 2] = r; d[k * 4 + 3] = 255;
        }
      });
      return { map: map, normalMap: normalTex(height, S, S, 3.4), roughnessMap: rough };
    }

    function cloudMap() {
      var S = CFG.tex.cloud;
      return dataTex(S, S, function (d) {
        for (var y = 0; y < S; y++) {
          for (var x = 0; x < S; x++) {
            var u = x / S, v = y / S;
            var warp = fbm3(u * 3.4, v * 3.4, 7.7, 4409, 4) - 0.5;
            var n = fbm3(u * 8 + warp * 1.6, v * 5 - warp * 1.2, 2.2, 4417, 5);
            var band = 0.5 + 0.5 * Math.sin(v * Math.PI * 3.2 + warp * 4.0);
            var a = clamp((n * 0.78 + band * 0.4 - 0.63) * 2.9, 0, 1);
            a = Math.pow(a, 1.5);
            var i = (y * S + x) * 4;
            d[i] = 255; d[i + 1] = 253; d[i + 2] = 250;
            d[i + 3] = a * 255;
          }
        }
      }, { srgb: true, wrapS: THREE.RepeatWrapping });
    }

    function planetMap(kind, seed) {
      var S = CFG.tex.band;
      return dataTex(S, S, function (d) {
        for (var y = 0; y < S; y++) {
          for (var x = 0; x < S; x++) {
            var u = x / S, v = y / S;
            var t, r, g, b;
            if (kind === 'giant') {
              var warp = fbm3(u * 2.2, v * 8, 4.4, seed, 4) - 0.5;
              var band = Math.sin((v * 26 + warp * 5.5) * Math.PI * 0.5);

              var land = cont * 0.85 + det * 0.28;

    function galaxyMap() {
      var S = CFG.tex.galaxy;
      return dataTex(S, S, function (d) {
        for (var y = 0; y < S; y++) {

            var u = (x + 0.5) / S * 2 - 1, v = (y + 0.5) / S * 2 - 1;
            var r = Math.sqrt(u * u + v * v);
            var a = Math.atan2(v, u);
            var i = (y * S + x) * 4;
            if (r > 1) { d[i + 3] = 0; continue; }
            var fall = Math.pow(1 - r, 1.15);
            var armPhase = a * 3.0 + Math.log(r + 0.05) * 2.4;
            var arm = Math.pow(Math.max(0, Math.sin(armPhase)), 2.2);
            var arm2 = Math.pow(Math.max(0, Math.sin(armPhase * 0.5 + 1.1)), 2.6) * 0.42;

            var core = Math.exp(-r * 9.0) * 1.6 + Math.exp(-r * r * 80) * 1.0;

            var bright = (core + disk) * fall - dust * fall * 0.5;
            bright = Math.max(0, bright);
            var warm = clamp(core * 1.3, 0, 1);
            var rr = bright * (0.82 + warm * 0.22);

            var bb = bright * (0.95 - warm * 0.08);

    function buildMoon() {

      var H = Math.sqrt(C.radius * C.radius - C.plateau * C.plateau);
      var seed = CFG.scatter.seed;

      var harmR = mulberry32(seed);
      var harm = [];
      var hk = [2, 3, 5, 7, 11];
      for (var h = 0; h < hk.length; h++) {
        harm.push({ k: hk[h], a: C.rimWobble * (0.35 + 0.65 * harmR()) / Math.sqrt(hk.length), ph: harmR() * Math.PI * 2 });
      }
      function plateauRadius(theta) {
        var s = 1;
        for (var i = 0; i < harm.length; i++) s += harm[i].a * Math.sin(harm[i].k * theta + harm[i].ph);
        return C.plateau * s;

      for (var i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        var dir = v.clone().normalize();
        var nBig = fbm3(dir.x * 2.1 + 11.3, dir.y * 2.1, dir.z * 2.1, seed, 4);

        v.copy(dir).multiplyScalar(r);
        var rad = Math.hypot(v.x, v.z);
        var Pe = plateauRadius(Math.atan2(v.z, v.x));
        var yThresh = Math.sqrt(Math.max(0.25, r * r - Pe * Pe));
        var t = smoothstep(yThresh - C.lip, yThresh + C.lip, v.y);
        var wy = (v.y - H) * (1 - t);

        pos.setXYZ(i, v.x, wy, v.z);

      var curve = new THREE.CatmullRomCurve3(profile, false, 'catmullrom', 0.5);
      var W = new THREE.Vector3(1, 0, 0);
      var pos = [], uvs = [], idx = [];
      var edgeA = [], edgeB = [];
      var wAxis = new THREE.Vector3(), uAxis = new THREE.Vector3();
      for (var v = 0; v <= segsV; v++) {
        var t = v / segsV;
        var P = curve.getPointAt(t);
        var T = curve.getTangentAt(t).normalize();
        var base = new THREE.Vector3().crossVectors(T, W).normalize();
        var phi = twistFn ? twistFn(t) : 0;
        wAxis.copy(W).multiplyScalar(Math.cos(phi)).addScaledVector(base, Math.sin(phi)).normalize();
        uAxis.copy(base).multiplyScalar(Math.cos(phi)).addScaledVector(W, -Math.sin(phi)).normalize();
        var w = widthFn(t), h = thickFn(t);
        for (var u = 0; u <= segsU; u++) {
          var ang = (u / segsU) * Math.PI * 2;
          var se = superellipse(ang, w, h, 3.4);
          pos.push(
            P.x + wAxis.x * se[0] + uAxis.x * se[1],
            P.y + wAxis.y * se[0] + uAxis.y * se[1],
            P.z + wAxis.z * se[0] + uAxis.z * se[1]
          );
          uvs.push((u / segsU) * uRepeat, t * vRepeat);
          if (u === 0) edgeA.push(new THREE.Vector3(pos[pos.length - 3], pos[pos.length - 2], pos[pos.length - 1]));
          if (u === segsU * 0.5) edgeB.push(new THREE.Vector3(pos[pos.length - 3], pos[pos.length - 2], pos[pos.length - 1]));
        }
      }
      for (var r = 0; r < segsV; r++) {
        for (var c2 = 0; c2 < segsU; c2++) {
          var a = r * (segsU + 1) + c2;
          var b = a + segsU + 1;
          idx.push(a, b, a + 1, a + 1, b, b + 1);
        }
      }
      var g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      g.setIndex(idx);
      g.computeVertexNormals();
      return { geo: g, edgeA: edgeA, edgeB: edgeB };
    }

    function tubeFromPoints(points, radius, segs, radial) {
      var c = new THREE.CatmullRomCurve3(points, false, 'catmullrom', 0.5);

    }

    function strut(a, b, rA, rB, mat, radial) {

        new THREE.Vector3(0, s + 0.470, -0.272),
        new THREE.Vector3(0, s + 0.520, -0.280)
      ];
      var widthFn = function (t) {
        if (t < 0.34) return 0.186 + 0.052 * Math.sin(t / 0.34 * Math.PI * 0.5);
        var k = (t - 0.34) / 0.66;
        return 0.238 - 0.044 * k * k;

      var twistFn = function (t) {

      var shell = sweepShell(profile, widthFn, thickFn, twistFn, 48, 26, 1.6, 1.15);

    function displaceSphere(geo, seed, amount, freq, octaves) {
      var pos = geo.attributes.position;
      var v = new THREE.Vector3();
      for (var i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        var len = v.length() || 1;
        var dir = v.clone().divideScalar(len);
        var n = fbm3(dir.x * freq + 5.1, dir.y * freq, dir.z * freq, seed, octaves);
        pos.setXYZ(i, dir.x * (len + amount * (n - 0.5) * 2), dir.y * (len + amount * (n - 0.5) * 2), dir.z * (len + amount * (n - 0.5) * 2));
      }
      geo.computeVertexNormals();
      return geo;
    }

      var mesh = new THREE.InstancedMesh(geo, mat, B.count);
      mesh.name = 'belt-rocks';
      mesh.frustumCulled = false;
      var r = mulberry32(CFG.scatter.seed + 41);
      var m = new THREE.Matrix4();
      var q = new THREE.Quaternion();
      var e = new THREE.Euler();
      var p = new THREE.Vector3();
      var s = new THREE.Vector3();
      for (var i = 0; i < B.count; i++) {
        var t = r();
        var dist = B.inner + (B.outer - B.inner) * Math.pow(t, 0.7);
        var ang = r() * Math.PI * 2;
        var y = (r() - 0.5) * 2 * B.bandHeight * (0.35 + 0.65 * r());
        p.set(Math.sin(ang) * dist, y, Math.cos(ang) * dist);
        e.set(r() * Math.PI * 2, r() * Math.PI * 2, r() * Math.PI * 2);
        q.setFromEuler(e);
        var sc = B.minSize + (B.maxSize - B.minSize) * Math.pow(r(), 2.2);
        s.set(sc * (0.7 + 0.6 * r()), sc * (0.7 + 0.6 * r()), sc * (0.7 + 0.6 * r()));
        m.compose(p, q, s);
        mesh.setMatrixAt(i, m);

    function starMaterial(sizeScale, brightness) {
      var m = new THREE.ShaderMaterial({
        uniforms: {
          uSize: { value: sizeScale * CFG.sky.pixelRatio },
          uBright: { value: brightness }
        },
        vertexShader: [
          'attribute float aSize;',
          'attribute float aBright;',
          'varying float vB;',
          'uniform float uSize;',
          'void main() {',
          '  vB = aBright;',
          '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
          '  gl_PointSize = uSize * aSize;',
          '}'
        ].join('\n'),
        fragmentShader: [
          'varying float vB;',
          'uniform float uBright;',
          'void main() {',
          '  float d = length(gl_PointCoord - vec2(0.5));',
          '  float a = smoothstep(0.5, 0.06, d);',
          '  float v = vB * uBright;',
          '  gl_FragColor = vec4(vec3(1.0), a * v);',
          '}'
        ].join('\n'),
        transparent: true,
        depthTest: false,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      m.userData.baseSize = sizeScale;
      return m;
    }

    function buildSky() {
      var S = CFG.sky;
      var group = new THREE.Group();
      group.name = 'sky';
      var r = mulberry32(CFG.scatter.seed + 777);

      var positions = new Float32Array(S.starCount * 3);
      var sizes = new Float32Array(S.starCount);
      var brights = new Float32Array(S.starCount);
      for (var i = 0; i < S.starCount; i++) {
        var u = r() * 2 - 1, th = r() * Math.PI * 2;
        var sr = Math.sqrt(1 - u * u);
        var rad = S.starRadius * (0.9 + 0.2 * r());
        positions[i * 3] = rad * sr * Math.cos(th);
        positions[i * 3 + 1] = rad * u;
        positions[i * 3 + 2] = rad * sr * Math.sin(th);
        var mag = Math.pow(r(), 2.6);
        sizes[i] = 1.0 + mag * 3.4;
        brights[i] = 0.28 + mag * 0.9;
      }
      var starGeo = new THREE.BufferGeometry();
      starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      starGeo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
      starGeo.setAttribute('aBright', new THREE.BufferAttribute(brights, 1));
      var stars = new THREE.Points(starGeo, starMaterial(0.9, 1.0));
      stars.name = 'stars';
      stars.frustumCulled = false;
      group.add(stars);
      PARTS.stars = stars;

      var bandCount = S.bandCount + S.bandClumps;
      var bPos = new Float32Array(bandCount * 3);
      var bSize = new Float32Array(bandCount);
      var bBright = new Float32Array(bandCount);
      var bandTilt = new THREE.Euler(0.42, 0.0, 0.62, 'YXZ');
      var v = new THREE.Vector3();
      for (var j = 0; j < bandCount; j++) {
        var isClump = j >= S.bandCount;
        var th2 = r() * Math.PI * 2;
        var spread = isClump ? S.bandSpread * 0.22 : S.bandSpread;
        var off = (r() + r() + r() - 1.5) * 2 * spread;
        v.set(Math.cos(off) * Math.cos(th2), Math.sin(off), Math.cos(off) * Math.sin(th2));
        v.applyEuler(bandTilt);
        var rad2 = S.bandRadius * (0.85 + 0.3 * r());
        bPos[j * 3] = v.x * rad2;
        bPos[j * 3 + 1] = v.y * rad2;
        bPos[j * 3 + 2] = v.z * rad2;
        var mag2 = Math.pow(r(), 3.0);
        bSize[j] = 1.0 + mag2 * 2.6;
        bBright[j] = 0.1 + mag2 * 0.55;
      }
      var bandGeo = new THREE.BufferGeometry();
      bandGeo.setAttribute('position', new THREE.BufferAttribute(bPos, 3));
      bandGeo.setAttribute('aSize', new THREE.BufferAttribute(bSize, 1));
      bandGeo.setAttribute('aBright', new THREE.BufferAttribute(bBright, 1));
      var band = new THREE.Points(bandGeo, starMaterial(0.8, 0.6));
      band.name = 'milky-way-band';
      band.frustumCulled = false;
      group.add(band);
      PARTS.band = band;
      PARTS.starMaterials = [stars.material, band.material];

      var galaxy = new THREE.Group();
      galaxy.name = 'galaxy';
      var G = S.galaxy;
      var tiltGroup = new THREE.Group();
      tiltGroup.rotation.set(G.tilt, 0, G.roll);
      var disk = new THREE.Mesh(new THREE.CircleGeometry(G.radius, 96), PARTS.tex.galaxy);
      tiltGroup.add(disk);
      var halo = new THREE.Mesh(new THREE.CircleGeometry(G.radius * 1.5, 64), new THREE.ShaderMaterial({
        uniforms: { uColor: { value: new THREE.Color(0x9fb4e0) } },
        vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
        fragmentShader: [
          'varying vec2 vUv; uniform vec3 uColor;',
          'void main(){',
          '  float d = length(vUv - 0.5) * 2.0;',
          '  float a = pow(clamp(1.0 - d, 0.0, 1.0), 2.4) * 0.13;',
          '  gl_FragColor = vec4(uColor, a);',
          '}'
        ].join('\n'),
        transparent: true, depthTest: false, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false
      }));
      tiltGroup.add(halo);
      galaxy.add(tiltGroup);
      placeAt(galaxy, G.azimuth, G.elevation, G.distance);
      galaxy.lookAt(0, 0, 0);
      tiltGroup.rotateZ(G.spin);
      group.add(galaxy);
      PARTS.galaxy = galaxy;

      S.nebula.forEach(function (cfg) {
        var mat = PARTS.tex.nebula.clone();
        mat.map = nebulaMap(cfg.seed);
        mat.color = new THREE.Color(cfg.color);
        mat.opacity = cfg.opacity;
        var q = new THREE.Mesh(new THREE.PlaneGeometry(cfg.size, cfg.size), mat);
        placeAt(q, cfg.azimuth, cfg.el, cfg.distance);
        q.lookAt(0, 0, 0);
        group.add(q);
      });

      var flareRnd = mulberry32(CFG.scatter.seed + 555);
      var fPos = new Float32Array(S.flares * 3);
      var fSize = new Float32Array(S.flares);
      var fTint = new Float32Array(S.flares * 3);
      for (var f = 0; f < S.flares; f++) {
        var fAz = flareRnd() * 360 - 180;
        var fEl = (flareRnd() * 2 - 1) * 76;
        var rad3 = 86000 + flareRnd() * 8000;
        var d3 = dirFrom(fAz, fEl).multiplyScalar(rad3);
        fPos[f * 3] = d3.x; fPos[f * 3 + 1] = d3.y; fPos[f * 3 + 2] = d3.z;
        fSize[f] = 0.45 + Math.pow(flareRnd(), 2.4) * 1.5;
        var tint2 = 0.6 + flareRnd() * 0.4;
        var cool = flareRnd();
        fTint[f * 3] = tint2 * (0.86 + cool * 0.2);
        fTint[f * 3 + 1] = tint2 * 0.92;
        fTint[f * 3 + 2] = tint2 * (1.0 - cool * 0.16);
      }
      var flareGeo = new THREE.BufferGeometry();
      flareGeo.setAttribute('position', new THREE.BufferAttribute(fPos, 3));
      flareGeo.setAttribute('aSize', new THREE.BufferAttribute(fSize, 1));
      flareGeo.setAttribute('aTint', new THREE.BufferAttribute(fTint, 3));
      var flares = new THREE.Points(flareGeo, new THREE.ShaderMaterial({
        uniforms: { tMap: { value: PARTS.tex.flare.map }, uScale: { value: 60 } },
        vertexShader: [
          'attribute float aSize; attribute vec3 aTint;',
          'varying vec3 vTint; uniform float uScale;',
          'void main(){',
          '  vTint = aTint;',
          '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
          '  gl_PointSize = aSize * uScale;',
          '}'
        ].join('\n'),
        fragmentShader: [
          'uniform sampler2D tMap; varying vec3 vTint;',
          'void main(){',
          '  vec4 t = texture2D(tMap, gl_PointCoord);',
          '  gl_FragColor = vec4(vTint * t.rgb, t.a);',
          '}'
        ].join('\n'),
        transparent: true, depthTest: false, depthWrite: false,
        blending: THREE.AdditiveBlending, toneMapped: false
      }));
      flares.name = 'star-flares';
      flares.frustumCulled = false;
      group.add(flares);
      PARTS.flares = flares;

      var sunHolder = new THREE.Group();
      sunHolder.name = 'sun';
      var sunDir = dirFrom(CFG.sun.azimuth, CFG.sun.elevation);
      var sunDisk = new THREE.Mesh(new THREE.CircleGeometry(S.sunRadius, 48), PARTS.tex.sunDisk);
      sunDisk.position.copy(sunDir).multiplyScalar(S.sunDistance);
      sunDisk.lookAt(0, 0, 0);
      sunHolder.add(sunDisk);
      var sunGlow = new THREE.Mesh(new THREE.CircleGeometry(S.sunGlowRadius, 64), PARTS.tex.sunGlow);
      sunGlow.position.copy(sunDir).multiplyScalar(S.sunDistance);
      sunGlow.lookAt(0, 0, 0);
      sunHolder.add(sunGlow);
      group.add(sunHolder);
      PARTS.sun = sunHolder;

      PARTS.sky = group;
      return group;
    }

    function buildLights() {
      var group = new THREE.Group();
      group.name = 'lights';

      var sunDir = dirFrom(CFG.sun.azimuth, CFG.sun.elevation);
      var sun = new THREE.DirectionalLight(CFG.sun.color, CFG.sun.intensity);
      sun.position.copy(sunDir).multiplyScalar(CFG.sun.distance);
      sun.target.position.set(0, 0, 0);
      group.add(sun, sun.target);
      if (CFG.renderer.shadows) {
        sun.castShadow = true;
        var S = CFG.shadow;
        sun.shadow.mapSize.set(S.size, S.size);
        sun.shadow.camera.left = -S.extent;
        sun.shadow.camera.right = S.extent;
        sun.shadow.camera.top = S.extent;
        sun.shadow.camera.bottom = -S.extent;
        sun.shadow.camera.near = S.near;
        sun.shadow.camera.far = S.far;
        sun.shadow.bias = S.bias;
        sun.shadow.normalBias = S.normalBias;
        sun.shadow.camera.updateProjectionMatrix();
      }
      PARTS.sunLight = sun;

      var homeDir = dirFrom(CFG.planets.home.azimuth, CFG.planets.home.elevation);
      var fill = new THREE.DirectionalLight(CFG.fill.color, CFG.fill.intensity);
      fill.position.copy(homeDir).multiplyScalar(CFG.fill.distance);
      fill.target.position.set(0, 0, 0);
      group.add(fill, fill.target);
      PARTS.fillLight = fill;

      var giantDir = dirFrom(CFG.planets.giant.azimuth, CFG.planets.giant.elevation);
      var rim = new THREE.DirectionalLight(CFG.rim.color, CFG.rim.intensity);
      rim.position.copy(giantDir).multiplyScalar(CFG.rim.distance);
      rim.target.position.set(0, 0, 0);
      group.add(rim, rim.target);
      PARTS.rimLight = rim;

      var hemi = new THREE.HemisphereLight(CFG.ambient.sky, CFG.ambient.ground, CFG.ambient.intensity);
      group.add(hemi);
      PARTS.hemi = hemi;

      var underTable = new THREE.PointLight(CFG.led.color, CFG.led.underTable, CFG.led.distance, 2);
      underTable.position.set(0, 0.44, 0);
      group.add(underTable);
      PARTS.leds.push(underTable);

      var deckLed = new THREE.PointLight(CFG.led.color, CFG.led.deck, CFG.led.distance, 2);
      deckLed.position.set(0, CFG.deck.thickness + 0.25, -CFG.deck.radius * 0.72);
      group.add(deckLed);
      PARTS.leds.push(deckLed);

      var postLed = new THREE.PointLight(0xffcf8f, 0.5, 2.6, 2);
      postLed.position.set(Math.sin(Math.PI * 0.75) * (CFG.deck.radius - 0.2), CFG.deck.postHeight, Math.cos(Math.PI * 0.75) * (CFG.deck.radius - 0.2));
      group.add(postLed);
      PARTS.leds.push(postLed);
      return group;
    }

    function buildGroundRocks() {
      var group = new THREE.Group();
      group.name = 'ground-rocks';
      PARTS.groundRocks = group;
      return group;
    }

    maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    buildMaterials();
    scene.environment = envEquirect();
    PARTS.moon = buildMoon();
    PARTS.groundRocks = buildGroundRocks();
    PARTS.props = buildProps();
    scene.add(PARTS.moon, PARTS.groundRocks, PARTS.props, buildPlanets(), buildBelt(), buildLights());
    skyScene.add(buildSky());

    scene.traverse(function (o) { o.frustumCulled = false; });
    skyScene.traverse(function (o) { o.frustumCulled = false; });

    var head = { yaw: 0, pitch: CFG.head.startPitch * Math.PI / 180, dragging: false };
    var chair = PARTS.chairs[CFG.props.chair.seatIndex];
    camera.position.set(
      chair.position.x,
      CFG.deck.thickness + CFG.head.height,
      chair.position.z - CFG.head.forward
    );
    scene.add(camera);

    function applyHead() {
      head.yaw = clamp(head.yaw, -CFG.head.yaw * Math.PI / 180, CFG.head.yaw * Math.PI / 180);
      head.pitch = clamp(head.pitch, CFG.head.pitchMin * Math.PI / 180, CFG.head.pitchMax * Math.PI / 180);
      camera.rotation.set(head.pitch, CFG.head.baseYaw * Math.PI / 180 + head.yaw, 0, 'YXZ');
    }
    function look(dx, dy) {
      head.yaw -= dx * CFG.head.sensitivity;
      head.pitch -= dy * CFG.head.sensitivity;
      applyHead();
    }
    function resetHead() {
      head.yaw = 0;
      head.pitch = CFG.head.startPitch * Math.PI / 180;
      applyHead();
    }
    applyHead();

    var hint = document.getElementById('hint');
    function requestLock() {
      if (document.pointerLockElement === canvas) return;
      var p = canvas.requestPointerLock && canvas.requestPointerLock();
      if (p && p.catch) p.catch(function () {});
    }
    canvas.addEventListener('mousedown', function (e) {
      if (document.pointerLockElement !== canvas) {
        head.dragging = true;
        requestLock();
      }
      e.preventDefault();
    });
    window.addEventListener('mouseup', function () { head.dragging = false; });
    document.addEventListener('mousemove', function (e) {
      if (document.pointerLockElement === canvas || head.dragging) look(e.movementX || 0, e.movementY || 0);
    });
    document.addEventListener('pointerlockchange', function () {
      hint.classList.toggle('gone', document.pointerLockElement === canvas);
    });
    document.addEventListener('pointerlockerror', function () { hint.classList.remove('gone'); });
    window.addEventListener('keydown', function (e) {
      if (e.code === 'KeyR') resetHead();
    });
    canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    var msaa = renderer.capabilities.isWebGL2 ? 4 : 0;
    var rt = new THREE.WebGLRenderTarget(2, 2, {
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      type: THREE.HalfFloatType,
      depthBuffer: true,
      stencilBuffer: false,
      samples: msaa
    });
    rt.texture.generateMipmaps = false;

    var rtScene = new THREE.Scene();
    var rtCamera = new THREE.Camera();
    var rtQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
    rtQuad.frustumCulled = false;
    rtScene.add(rtQuad);

    function blit(material, target) {
      rtQuad.material = material;
      renderer.setRenderTarget(target || null);
      renderer.render(rtScene, rtCamera);
    }

    function rtOpts(depth) {
      return {
        minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
        type: THREE.HalfFloatType, depthBuffer: !!depth, stencilBuffer: false
      };
    }
    var bloomA = new THREE.WebGLRenderTarget(2, 2, rtOpts(false));
    var bloomB = new THREE.WebGLRenderTarget(2, 2, rtOpts(false));
    [bloomA, bloomB].forEach(function (t) { t.texture.generateMipmaps = false; });

    var quadVS = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';

    var brightMat = new THREE.ShaderMaterial({
      uniforms: {
        tColor: { value: rt.texture },
        uThreshold: { value: CFG.lens.bloomThreshold },
        uKnee: { value: CFG.lens.bloomKnee },
        uTexel: { value: new THREE.Vector2() }
      },
      vertexShader: quadVS,
      fragmentShader: [
        'uniform sampler2D tColor; uniform float uThreshold, uKnee; uniform vec2 uTexel;',
        'varying vec2 vUv;',
        'void main(){',
        '  vec3 sum = vec3(0.0);',
        '  sum += texture2D(tColor, vUv + vec2(-1.0, -1.0) * uTexel).rgb;',
        '  sum += texture2D(tColor, vUv + vec2( 1.0, -1.0) * uTexel).rgb;',
        '  sum += texture2D(tColor, vUv + vec2(-1.0,  1.0) * uTexel).rgb;',
        '  sum += texture2D(tColor, vUv + vec2( 1.0,  1.0) * uTexel).rgb;',
        '  vec3 c = sum * 0.25;',
        '  float l = max(c.r, max(c.g, c.b));',
        '  float soft = clamp(l - uThreshold + uKnee, 0.0, 2.0 * uKnee);',
        '  soft = soft * soft / (4.0 * uKnee + 0.0001);',
        '  float w = max(soft, l - uThreshold) / max(l, 0.0001);',
        '  gl_FragColor = vec4(c * w, 1.0);',
        '}'
      ].join('\n'),
      depthTest: false, depthWrite: false
    });

    var blurMat = new THREE.ShaderMaterial({
      uniforms: { tColor: { value: null }, uDir: { value: new THREE.Vector2() } },
      vertexShader: quadVS,
      fragmentShader: [
        'uniform sampler2D tColor; uniform vec2 uDir;',
        'varying vec2 vUv;',
        'void main(){',
        '  vec3 sum = texture2D(tColor, vUv).rgb * 0.227027;',
        '  sum += texture2D(tColor, vUv + uDir * 1.3846).rgb * 0.316216;',
        '  sum += texture2D(tColor, vUv - uDir * 1.3846).rgb * 0.316216;',
        '  sum += texture2D(tColor, vUv + uDir * 3.2308).rgb * 0.070270;',
        '  sum += texture2D(tColor, vUv - uDir * 3.2308).rgb * 0.070270;',
        '  gl_FragColor = vec4(sum, 1.0);',
        '}'
      ].join('\n'),
      depthTest: false, depthWrite: false
    });

    var lensMaterial = new THREE.ShaderMaterial({
      uniforms: {
        tColor: { value: rt.texture },
        tBloom: { value: bloomA.texture },
        uBloom: { value: CFG.lens.bloom },
        uDistortion: { value: CFG.lens.distortion },
        uVignette: { value: CFG.lens.vignette },
        uVigStart: { value: CFG.lens.vignetteStart },
        uVigEnd: { value: CFG.lens.vignetteEnd },
        uAspect: { value: 1 },
        uExposure: { value: CFG.renderer.exposure },
        uDither: { value: CFG.lens.dither },
        uTime: { value: 0 }
      },
      vertexShader: quadVS,
      fragmentShader: [
        'uniform sampler2D tColor;',
        'uniform sampler2D tBloom;',
        'uniform float uDistortion, uVignette, uVigStart, uVigEnd, uAspect, uExposure, uBloom, uDither, uTime;',
        'varying vec2 vUv;',
        'vec3 aces(vec3 x){ return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }',
        'float toSRGB(float c){ return c < 0.0031308 ? c * 12.92 : 1.055 * pow(c, 1.0 / 2.4) - 0.055; }',
        'float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }',
        'void main(){',
        '  vec2 c = vUv - 0.5;',
        '  vec2 d = vec2(c.x * uAspect, c.y);',
        '  float r = length(d);',
        '  float k = 1.0 + uDistortion * r * r;',
        '  vec2 du = d * k;',
        '  vec2 suv = 0.5 + vec2(du.x / uAspect, du.y);',
        '  vec2 cuv = clamp(suv, vec2(0.0005), vec2(0.9995));',
        '  vec3 col = texture2D(tColor, cuv).rgb;',
        '  col += texture2D(tBloom, cuv).rgb * uBloom;',
        '  col *= uExposure;',
        '  col = aces(col);',
        '  col = vec3(toSRGB(col.r), toSRGB(col.g), toSRGB(col.b));',
        '  float v = 1.0 - uVignette * smoothstep(uVigStart, uVigEnd, r);',
        '  col *= v;',
        '  float n = hash12(gl_FragCoord.xy + fract(uTime) * 137.0) - 0.5;',
        '  col += n * uDither;',
        '  gl_FragColor = vec4(col, 1.0);',
        '}'
      ].join('\n'),
      depthTest: false,
      depthWrite: false
    });

    function resize() {
      var w = window.innerWidth, h = window.innerHeight;
      var dpr = Math.min(window.devicePixelRatio || 1, CFG.renderer.pixelRatio);
      renderer.setPixelRatio(dpr);
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      wideProjection(camera);
      skyCamera.aspect = w / h;
      wideProjection(skyCamera);
      var bw = Math.max(2, Math.floor(w * dpr * 0.5)), bh = Math.max(2, Math.floor(h * dpr * 0.5));
      rt.setSize(Math.max(2, Math.floor(w * dpr)), Math.max(2, Math.floor(h * dpr)));
      bloomA.setSize(bw, bh);
      bloomB.setSize(bw, bh);
      brightMat.uniforms.uTexel.value.set(1 / (w * dpr), 1 / (h * dpr));
      lensMaterial.uniforms.uAspect.value = w / h;
      for (var si = 0; si < PARTS.starMaterials.length; si++) {
        PARTS.starMaterials[si].uniforms.uSize.value = PARTS.starMaterials[si].userData.baseSize * dpr;
      }
    }
    window.addEventListener('resize', resize);
    resize();

    var sFps = document.getElementById('s-fps');
    var sMs = document.getElementById('s-ms');
    var sCalls = document.getElementById('s-calls');
    var sTris = document.getElementById('s-tris');

    var last = performance.now();
    var frames = 0, statTime = 0;
    var beltSpin = 0;

    function loop() {
      requestAnimationFrame(loop);
      var now = performance.now();
      var frameMs = now - last;
      last = now;
      frames++; statTime += frameMs;

      beltSpin += CFG.scatter.belt.spin * frameMs * 0.001;
      PARTS.belt.rotation.y = beltSpin;
      for (var ai = 0; ai < PARTS.anim.length; ai++) {
        PARTS.anim[ai].obj.rotation.y += PARTS.anim[ai].spin * frameMs * 0.001;
      }

      camera.updateMatrixWorld();
      skyCamera.position.copy(camera.position);
      skyCamera.quaternion.copy(camera.quaternion);
      skyCamera.updateMatrixWorld();

      renderer.setRenderTarget(rt);
      renderer.info.reset();
      renderer.clear(true, true, true);
      renderer.render(skyScene, skyCamera);
      renderer.clearDepth();
      renderer.render(scene, camera);

      if (CFG.lens.bloom > 0) {
        blit(brightMat, bloomA);
        blurMat.uniforms.tColor.value = bloomA.texture;
        blurMat.uniforms.uDir.value.set(1 / bloomA.width, 0);
        blit(blurMat, bloomB);
        blurMat.uniforms.tColor.value = bloomB.texture;
        blurMat.uniforms.uDir.value.set(0, 1 / bloomA.height);
        blit(blurMat, bloomA);
      }

      lensMaterial.uniforms.uTime.value = now * 0.001;
      renderer.setRenderTarget(null);
      renderer.clear(true, true, true);
      blit(lensMaterial, null);

      if (statTime >= 250) {
        var info = renderer.info.render;
        sFps.textContent = (frames * 1000 / statTime).toFixed(0);
        sMs.textContent = (statTime / frames).toFixed(2) + ' ms';
        sCalls.textContent = String(info.calls);
        sTris.textContent = info.triangles.toLocaleString('tr-TR');
        frames = 0; statTime = 0;
      }
    }
    loop();

    window.APP = {
      THREE: THREE, CFG: CFG, SURF: SURF, PARTS: PARTS, renderer: renderer,
      scene: scene, skyScene: skyScene, camera: camera, head: head,
      resetHead: resetHead, look: look, rng: mulberry32, noise: fbm3
    };
  })();
  </script>
</body>
</html>
